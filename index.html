<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Novel Translator Pro - Puter.js</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --sidebar-width: 300px; --primary: #2563eb; }
        body { font-family: 'Segoe UI', Tahoma; margin: 0; display: flex; height: 100vh; background: #f1f5f9; }
        
        /* Sidebar */
        .sidebar { width: var(--sidebar-width); background: #fff; border-right: 1px solid #cbd5e1; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #eee; }
        #chapterList { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        #chapterList li { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f8fafc; font-size: 14px; }
        #chapterList li:hover { background: #f1f5f9; }
        #chapterList li.active { background: #dbeafe; color: var(--primary); font-weight: bold; }
        #chapterList li.translated { border-left: 4px solid #22c55e; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #fff; padding: 15px; border-radius: 8px; }
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; min-height: 0; }
        
        textarea, .output { width: 100%; height: 100%; padding: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; background: #fff; overflow-y: auto; font-size: 16px; line-height: 1.7; }
        .output { white-space: pre-wrap; position: relative; }
        
        .rules-box { margin-bottom: 15px; }
        #rulesInput { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1; }
        
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 5px; background: var(--primary); color: white; font-weight: 600; }
        button:disabled { background: #94a3b8; }
        .btn-download { background: #059669; }
        .auto-next-label { display: flex; align-items: center; gap: 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3>Danh sách chương</h3>
        <input type="file" id="fileInput" accept=".txt">
        <p style="font-size: 11px; color: #64748b;">Hỗ trợ file cực lớn (1000+ chương)</p>
    </div>
    <ul id="chapterList"></ul>
</div>

<div class="main">
    <div class="rules-box">
        <input type="text" id="rulesInput" placeholder="Quy tắc dịch (VD: Xưng hô ta - ngươi, dịch 'Linh khí' thành 'Linh lực'...)">
    </div>

    <div class="toolbar">
        <button id="btnTranslate" onclick="translateCurrentChapter()">Dịch chương này</button>
        <label class="auto-next-label">
            <input type="checkbox" id="autoNext"> Tự động dịch tiếp chương sau
        </label>
        <button class="btn-download" onclick="downloadAll()">Tải xuống bản dịch (.txt)</button>
        <span id="status" style="margin-left: auto; font-size: 13px; color: #64748b;">Đang chờ file...</span>
    </div>

    <div class="workspace">
        <div id="sourceView" class="textarea" style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; overflow-y: auto;">
            Nội dung gốc sẽ hiện ở đây...
        </div>
        <div class="output" id="resultView">
            Kết quả dịch...
        </div>
    </div>
</div>

<script>
    let chapters = [];
    let translatedData = JSON.parse(localStorage.getItem('translated_novel') || '{}');
    let currentIndex = -1;

    // 1. Phân tách chương truyện
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const fullText = e.target.result;
            // Regex nhận diện "Chương X", "第X章", "Tiết X"...
            const chapterRegex = /(^|\n)(Chương\s*\d+|第\s*\d+\s*章|Tiết\s*\d+|Chapter\s*\d+)/gi;
            
            const titles = fullText.match(chapterRegex) || [];
            const contents = fullText.split(chapterRegex);

            // Xử lý gộp tiêu đề và nội dung
            chapters = [];
            let contentIdx = 0;
            
            // Nếu file không có tiêu đề chương rõ ràng, coi như 1 chương
            if (titles.length === 0) {
                chapters.push({ title: "Toàn bộ văn bản", content: fullText });
            } else {
                for (let i = 0; i < titles.length; i++) {
                    chapters.push({
                        title: titles[i].trim(),
                        content: contents[(i * 3) + 2] || "" 
                    });
                }
            }
            renderChapterList();
            document.getElementById('status').innerText = `Đã tìm thấy ${chapters.length} chương.`;
        };
        reader.readAsText(file);
    });

    // 2. Hiển thị danh sách chương
    function renderChapterList() {
        const list = document.getElementById('chapterList');
        list.innerHTML = "";
        chapters.forEach((ch, index) => {
            const li = document.createElement('li');
            li.innerText = ch.title;
            if (translatedData[index]) li.classList.add('translated');
            li.onclick = () => loadChapter(index);
            li.id = `ch-${index}`;
            list.appendChild(li);
        });
    }

    // 3. Tải chương lên màn hình làm việc
    function loadChapter(index) {
        currentIndex = index;
        document.querySelectorAll('#chapterList li').forEach(li => li.classList.remove('active'));
        document.getElementById(`ch-${index}`).classList.add('active');
        
        document.getElementById('sourceView').innerText = chapters[index].content;
        document.getElementById('resultView').innerText = translatedData[index] || "Chưa dịch chương này.";
        
        document.getElementById('status').innerText = `Đang xem: ${chapters[index].title}`;
    }

    // 4. Hàm dịch thuật chính
    async function translateCurrentChapter() {
        if (currentIndex === -1) return alert("Hãy chọn một chương!");
        
        const btn = document.getElementById('btnTranslate');
        const resultView = document.getElementById('resultView');
        const rules = document.getElementById('rulesInput').value;
        const autoNext = document.getElementById('autoNext').checked;

        btn.disabled = true;
        resultView.innerText = "";

        try {
            const prompt = `Bạn là một biên dịch viên chuyên nghiệp. Dịch chương truyện sau sang tiếng Việt. 
            Quy tắc bổ sung: ${rules || 'Dịch sát nghĩa, mượt mà'}.
            Chỉ trả về bản dịch.
            Nội dung: ${chapters[currentIndex].content}`;

            const response = await puter.ai.chat(prompt, { stream: true });

            let fullTranslation = "";
            for await (const part of response) {
                if (part?.text) {
                    fullTranslation += part.text;
                    resultView.innerText = fullTranslation;
                    document.getElementById('resultView').scrollTop = document.getElementById('resultView').scrollHeight;
                }
            }

            // Lưu dữ liệu
            translatedData[currentIndex] = fullTranslation;
            localStorage.setItem('translated_novel', JSON.stringify(translatedData));
            document.getElementById(`ch-${currentIndex}`).classList.add('translated');

            // Tự động chuyển chương
            if (autoNext && currentIndex < chapters.length - 1) {
                document.getElementById('status').innerText = "Đang chuyển chương sau...";
                setTimeout(() => {
                    loadChapter(currentIndex + 1);
                    translateCurrentChapter();
                }, 2000);
            }

        } catch (error) {
            alert("Lỗi dịch: " + error.message);
        } finally {
            btn.disabled = false;
        }
    }

    // 5. Xuất file
    function downloadAll() {
        let finalOutput = "";
        chapters.forEach((ch, index) => {
            if (translatedData[index]) {
                finalOutput += `--- ${ch.title} ---\n\n${translatedData[index]}\n\n`;
            }
        });

        if (!finalOutput) return alert("Chưa có chương nào được dịch!");

        const blob = new Blob([finalOutput], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Ban_Dich_AI.txt";
        a.click();
    }
</script>
</body>
</html>
